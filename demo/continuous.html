<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mothdraw: continuous</title>
    <style>
      :root { --ink: #1d1b18; --paper: #f6f3ec; --muted: #6e6a62; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) { --ink: #e9e5dc; --paper: #161513; --muted: #9a958b; }
      }
      :root[data-theme='dark'] { --ink: #e9e5dc; --paper: #161513; --muted: #9a958b; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-rows: 1fr auto;
        background: var(--paper);
        color: var(--ink);
        font: 15px/1.4 ui-serif, Georgia, serif;
      }
      #plate { width: 100%; height: 100%; min-height: 70vh; }
      footer { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: center; padding: 12px 16px 20px; }
      #log { color: var(--muted); font: 13px ui-monospace, monospace; min-width: 24ch; }
      button { font: inherit; color: inherit; background: transparent; border: 1px solid currentColor; border-radius: 4px; padding: 4px 10px; }
    </style>
  </head>
  <body>
    <div id="plate"></div>
    <footer>
      <span id="log">starting…</span>
      <button id="next">Next moth</button>
      <button id="theme">Switch theme</button>
      <button id="toggle">Destroy</button>
    </footer>
    <script type="module">
      import { mount } from '../src/index.js';

      const plate = document.getElementById('plate');
      const log = document.getElementById('log');
      const toggle = document.getElementById('toggle');
      // ?seed=abc gives a fixed sequence; ?draw=7&hold=6 change the timings.
      const params = new URLSearchParams(location.search);
      const options = {
        seed: params.get('seed') || undefined,
        drawSeconds: Number(params.get('draw')) || undefined,
        holdSeconds: Number(params.get('hold')) || undefined,
        onMoth: ({ name, seed, family }) => { log.textContent = `${name} · ${family} · seed ${seed}`; },
      };
      let plateApi = mount(plate, options);

      document.getElementById('next').onclick = () => plateApi?.next();
      document.getElementById('theme').onclick = () => {
        const dark = getComputedStyle(document.body).color === 'rgb(233, 229, 220)';
        document.documentElement.dataset.theme = dark ? 'light' : 'dark';
      };
      toggle.onclick = () => {
        if (plateApi) {
          plateApi.destroy();
          plateApi = null;
          log.textContent = 'destroyed';
          toggle.textContent = 'Mount again';
        } else {
          plateApi = mount(plate, options);
          toggle.textContent = 'Destroy';
        }
      };
    </script>
  </body>
</html>
