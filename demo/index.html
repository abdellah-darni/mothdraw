<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mothdraw</title>
    <style>
      :root {
        --ink: #1d1b18;
        --paper: #f6f3ec;
        --muted: #6e6a62;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e9e5dc;
          --paper: #161513;
          --muted: #9a958b;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-rows: 1fr auto;
        background: var(--paper);
        color: var(--ink);
        font: 15px/1.4 ui-serif, Georgia, serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 60vh;
      }
      footer {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
        justify-content: center;
        padding: 12px 16px 20px;
      }
      #name { font-style: italic; font-size: 18px; }
      #stats { color: var(--muted); font: 13px ui-monospace, monospace; }
      form { display: flex; gap: 8px; }
      input, button, a.button {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid currentColor;
        border-radius: 4px;
        padding: 4px 10px;
        text-decoration: none;
      }
      input { width: 12ch; }
    </style>
  </head>
  <body>
    <canvas id="moth" aria-label="Procedurally drawn moth"></canvas>
    <footer>
      <span id="name"></span>
      <span id="stats"></span>
      <form id="seed-form">
        <input id="seed" name="seed" aria-label="Seed" />
        <button type="submit">Draw</button>
        <button type="button" id="random">New seed</button>
      </form>
      <a class="button" id="svg" download="moth.svg" href="#">Download SVG</a>
    </footer>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
